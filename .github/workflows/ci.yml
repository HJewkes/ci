name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm run verify

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # all-green runs on the runner's preinstalled Node, which may still be 20.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm run verify

  repo-fixture-npm:
    uses: ./.github/workflows/node.yml
    with:
      working-directory: fixtures/npm
      compat-versions: '[22, 24]'
      audit-omit-dev: true

  repo-fixture-pnpm:
    uses: ./.github/workflows/node.yml
    with:
      working-directory: fixtures/pnpm
      secrets-scan: false
      setup: node --version

  repo-fixture-pnpm-turbo:
    uses: ./.github/workflows/node.yml
    with:
      working-directory: fixtures/pnpm-turbo
      compat-versions: '[22, 24]'
      secrets-scan: false

  check:
    if: always()
    needs: [verify, compat, repo-fixture-npm, repo-fixture-pnpm, repo-fixture-pnpm-turbo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: actions
      - uses: ./actions/all-green
        with:
          needs: ${{ toJSON(needs) }}
