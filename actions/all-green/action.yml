name: all-green
description: >-
  Aggregator for a workflow's required `check` job. Fails unless every needed job
  succeeded, and unless `needs` names every other job in the calling workflow file.
inputs:
  needs:
    description: The expression toJSON(needs) from the calling job.
    required: true
  allow-skipped:
    description: Comma- or whitespace-separated job ids whose `skipped` result counts as passing.
    required: false
    default: ''
  workflow-file:
    description: >-
      Path under .github/workflows/ of the workflow that defines the calling job. Empty takes it
      from job.workflow_file_path, or from GITHUB_WORKFLOW_REF where the runner sets no job.workflow_*.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Resolve the workflow file
      id: source
      shell: bash
      env:
        WORKFLOW_FILE: ${{ inputs.workflow-file }}
        JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
      run: node "$GITHUB_ACTION_PATH/all-green.mjs" resolve
    - name: Check out the workflow files at the running commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.source.outputs.repository }}
        ref: ${{ steps.source.outputs.ref }}
        path: .all-green-src
        sparse-checkout: .github
        fetch-depth: 1
        persist-credentials: false
    - name: Evaluate needs
      shell: bash
      env:
        NEEDS_JSON: ${{ inputs.needs }}
        ALLOW_SKIPPED: ${{ inputs.allow-skipped }}
        WORKFLOW_FILE: ${{ steps.source.outputs.workflow-file }}
        WORKFLOW_ROOT: ${{ github.workspace }}/.all-green-src
      run: node "$GITHUB_ACTION_PATH/all-green.mjs"
